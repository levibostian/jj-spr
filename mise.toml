[tools]
go = "1.27.3"
goreleaser = "2.19.0"
packslip = "1.11.3"

[tasks.format]
description = "Format the whole Go module"
run = "go fmt ./..."

[tasks.format-files]
description = "Format only the given .go files"
sources = ["**/*.go"]
run = "gofmt -w"

[tasks.lint]
description = "Vet the whole Go module"
run = "go vet ./..."

[tasks.lint-files]
description = "Vet only the packages of the given .go files"
sources = ["**/*.go"]
run = "sh -c 'go vet $(dirname \"$@\" | sed \"s|^|./|\" | sort -u)' --"

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."

[tasks.build]
description = "Build jj-spr for the host architecture into ./jj-spr"
run = "go build -o jj-spr ."

[tasks.build-all]
description = "Build tar.gz/zip release archives for linux, darwin and windows (amd64 + arm64) into dist/, named for VERSION (default 0.0.0)"
run = '''
set -eu
VERSION="${VERSION:-0.0.0}" goreleaser release --snapshot --clean
'''

[tasks.packslip]
description = "Sign the archives in dist/ with packslip into dist/packslip.sigstore.json (no upload), keyless with the CI identity"
run = '''
set -eu
: "${VERSION:?set VERSION, for example: VERSION=1.2.3 mise run packslip}"

project="github.com/levibostian/jj-spr"
packslip create \
  --project "$project" \
  --version "$VERSION" \
  --bin jj-spr \
  --url-base "https://${project}/releases/download/${VERSION}" \
  --out dist \
  dist/jj-spr_*.tar.gz dist/jj-spr_*.zip
'''
